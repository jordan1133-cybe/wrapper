<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bridge Test</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, system-ui, sans-serif;
    background: #f5f5f5;
    color: #222;
    padding: 16px;
    padding-top: env(safe-area-inset-top, 16px);
  }
  .banner {
    background: #ff9800;
    color: #fff;
    text-align: center;
    padding: 6px;
    font-size: 11px;
    font-weight: bold;
    border-radius: 4px;
    margin-bottom: 12px;
  }
  h1 { font-size: 18px; margin-bottom: 16px; text-align: center; }
  .btn-row { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
  button {
    display: flex; align-items: center; gap: 8px;
    width: 100%;
    padding: 14px 16px;
    font-size: 15px;
    border: none;
    border-radius: 8px;
    background: #000;
    color: #fff;
    cursor: pointer;
    text-align: left;
  }
  button:active { background: #4b4949; }
  button.error-btn { background: #d32f2f; }
  button:disabled { opacity: 0.5; }
  .result-box {
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 12px;
    margin-bottom: 10px;
  }
  .result-box h3 { font-size: 13px; color: #888; margin-bottom: 4px; }
  #log {
    background: #263238;
    color: #b2ff59;
    font-family: monospace;
    font-size: 12px;
    padding: 12px;
    border-radius: 8px;
    max-height: 300px;
    overflow-y: auto;
    white-space: pre-wrap;
    word-break: break-all;
  }
  .status-waiting { color: #888; }
  .status-sent { color: #1976d2; }
  .status-success { color: #2e7d32; }
  .status-error { color: #d32f2f; }
</style>
</head>
<body>

<div class="banner">Native Bridge Test Harness</div>
<h1>Dashen Native Bridge Test</h1>

<div class="btn-row">
  <button onclick="testAction('get_location', {highAccuracy: true})">
    📍 Get Location
  </button>
  <button onclick="testAction('open_camera', {})">
    📷 Open Camera
  </button>
  <button onclick="testAction('pick_file', {type: 'image'})">
    📁 Pick File (image)
  </button>
  <button onclick="testAction('pick_file', {type: 'any'})">
    📄 Pick File (any)
  </button>
  <button class="error-btn" onclick="testAction('test_unknown_action', {})">
    ❌ Test Unknown Action
  </button>
</div>

<div class="result-box">
  <h3>Status</h3>
  <div id="status" class="status-waiting">Waiting…</div>
</div>
<div class="result-box">
  <h3>Last Request ID</h3>
  <div id="reqId">—</div>
</div>
<div class="result-box">
  <h3>Response</h3>
  <div id="response">—</div>
</div>

<div class="result-box">
  <h3>Log</h3>
  <div id="log"></div>
</div>

<script>
// ---------------------------------------------------------------------------
// Bridge response callback
//
// This is the function that Flutter's BridgeHandler._sendResponse() calls
// via runJavaScript():
//
//   window.DashenBridge.onResponse({ requestId, status, payload, error })
//
// addJavaScriptChannel('DashenBridge') creates window.DashenBridge.postMessage
// but does NOT create onResponse — we must define it ourselves.
// ---------------------------------------------------------------------------

// Ensure the DashenBridge namespace exists.
// addJavaScriptChannel already creates window.DashenBridge with postMessage(),
// so we only add onResponse onto it; we do NOT overwrite the object.
if (!window.DashenBridge) {
  // Fallback in case page loads before channel is injected (shouldn't happen,
  // but defensive). postMessage will be overwritten by Flutter anyway.
  window.DashenBridge = {};
}

window.DashenBridge.onResponse = function(response) {
  log('← RESPONSE: ' + JSON.stringify(response, null, 2));

  var el = document.getElementById;

  document.getElementById('reqId').textContent = response.requestId || '—';

  if (response.status === 'success') {
    document.getElementById('status').textContent = '✅ Success';
    document.getElementById('status').className = 'status-success';

    // For camera/file picker, show metadata only (not the full base64 blob)
    var display = response.payload ? Object.assign({}, response.payload) : {};
    if (display.data && display.transport === 'base64') {
      display.data = '[base64 ' + display.data.length + ' chars]';
    }
    document.getElementById('response').textContent =
      JSON.stringify(display, null, 2);
  } else {
    document.getElementById('status').textContent =
      '❌ ' + (response.status || 'error').toUpperCase();
    document.getElementById('status').className = 'status-error';

    document.getElementById('response').textContent =
      response.error
        ? response.error.code + ': ' + response.error.message
        : JSON.stringify(response, null, 2);
  }
};

// ---------------------------------------------------------------------------
// Request helper
// ---------------------------------------------------------------------------

var counter = 0;

function testAction(action, payload) {
  counter++;
  var requestId = action + '-' + counter + '-' + Date.now();
  var message = JSON.stringify({
    requestId: requestId,
    action: action,
    payload: payload || {}
  });

  document.getElementById('status').textContent = '⏳ Sending…';
  document.getElementById('status').className = 'status-sent';
  document.getElementById('reqId').textContent = requestId;
  document.getElementById('response').textContent = '…';

  log('→ REQUEST: ' + message);

  try {
    // This calls the JavaScriptChannel registered by Flutter.
    // addJavaScriptChannel('DashenBridge') creates:
    //   window.DashenBridge.postMessage(String)
    DashenBridge.postMessage(message);
    log('   postMessage sent OK');
  } catch (e) {
    log('   ERROR: postMessage failed — ' + e.message);
    document.getElementById('status').textContent = ' postMessage failed';
    document.getElementById('status').className = 'status-error';
    document.getElementById('response').textContent = e.message;
  }
}

// ---------------------------------------------------------------------------
// Simple log
// ---------------------------------------------------------------------------

function log(msg) {
  var el = document.getElementById('log');
  var time = new Date().toLocaleTimeString();
  el.textContent += '[' + time + '] ' + msg + '\n';
  el.scrollTop = el.scrollHeight;
}

log('Test harness loaded.');
log('DashenBridge channel: ' + (typeof DashenBridge !== 'undefined' ? 'available' : 'NOT FOUND'));
log('DashenBridge.postMessage: ' + (typeof DashenBridge !== 'undefined' && typeof DashenBridge.postMessage === 'function' ? 'ready' : 'NOT FOUND'));
</script>

</body>
</html>
