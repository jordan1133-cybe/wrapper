name: sales_rep_wrapper
description: "Dashen Breweries Sales Rep PWA Wrapper"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  webview_flutter: ^4.14.1
  url_launcher: ^6.3.1
  geolocator: ^14.1.1
  image_picker: ^1.2.4
  file_picker: ^13.1.0
  permission_handler: ^12.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # DEVELOPMENT ONLY — test harness page for validating the native bridge.
  assets:
    - assets/test_harness.html
